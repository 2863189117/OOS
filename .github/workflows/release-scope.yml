name: release-scope

on:
  push:
  pull_request:

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository boundary
        run: python3 scripts/check_release_scope.py
      - name: Parse Python sources
        run: python3 -m compileall -q examples scripts
